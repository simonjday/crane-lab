# Custom stage 20_DestinationTweaks — environment-specific change for the new cluster.
# Strategic-merge patch: env entries merge by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: shop
spec:
  template:
    spec:
      containers:
        - name: podinfo
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Shop v1.0.3 — migrated by Konveyor Crane, running on crane-dst"
            - name: PODINFO_UI_COLOR
              value: "#2e7d32"
