apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: contour
      namespace: projectcontour
  hostnames:
    - argocd.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
