# crane-src — the "legacy" cluster. Rendered with envsubst by scripts/10-clusters.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ${SRC_CLUSTER}
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080            # shop (podinfo) NodePort
        hostPort: ${SRC_APP_PORT}
        listenAddress: "${LISTEN_ADDRESS}"
        protocol: TCP
