# The "legacy" shop on crane-src.
# Deliberately NOT in gitops/: it represents an app someone kubectl-applied years ago,
# then hot-fixed in place (see scripts/30-src-legacy-app.sh). Crane's job is to recover
# redeployable manifests from what is actually running.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: shop
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    save 60 1
    dir /data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: shop
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: shop
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shop
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  strategy:
    type: Recreate                   # RWO volume
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:${REDIS_TAG}
          args: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shop
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: shop
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:${PODINFO_TAG}
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_CACHE_SERVER
              value: tcp://redis:6379
            - name: PODINFO_UI_MESSAGE
              value: "Shop v1 — running on crane-src"
            - name: PODINFO_UI_COLOR
              value: "#7c3434"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: shop
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: shop
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
      nodePort: 30080               # explicit, so crane keeps it (it reads last-applied-configuration)
